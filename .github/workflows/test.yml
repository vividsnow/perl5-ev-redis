name: "Test"
on:
  pull_request:
  push:
    branches:
      - "master"
  workflow_dispatch:

jobs:
  test-xt:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: "5.40"
          install-modules-with: cpm
          install-modules-args: --with-develop --with-configure

      - name: Install aspell
        run: |
          sudo apt-get update
          sudo apt-get install -y aspell aspell-en

      - name: Set up Redis
        uses: shogo82148/actions-setup-redis@v1
        with:
          redis-version: "7.4"
          auto-start: false

      - name: Test
        run: |
          perl Makefile.PL && make && RELEASE_TESTING=1 make test

  list:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: list
        id: set-matrix
        shell: perl {0}
        run: |
          use strict;
          use warnings;
          use JSON::PP qw(encode_json);
          my @perl = qw(5.40 5.38 5.36 5.34 5.32 5.30 5.28 5.26 5.24 5.22 5.20 5.18 5.16 5.14);
          my @redis = qw(7.4 7.2 7.0 6.2 6.0 5.0);
          my @include = map { +{ perl => $perl[0], redis => $_, os => 'macos-latest' } } @redis;
          push @include, { perl => '5', redis => '8', os => 'ubuntu-latest' };
          my $matrix = { perl => \@perl, redis => \@redis, os => ['ubuntu-latest'], include => \@include };
          open my $fh, '>>', $ENV{GITHUB_OUTPUT} or die "GITHUB_OUTPUT: $!";
          print {$fh} 'matrix=', encode_json($matrix), "\n";
          close $fh or die "GITHUB_OUTPUT: $!";

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    needs: list

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.list.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Perl ${{ matrix.perl }}
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl }}
          install-modules-with: cpanm
          install-modules-args: --with-configure --with-test --notest

      - name: Set up Redis ${{ matrix.redis }}
        uses: shogo82148/actions-setup-redis@v1
        with:
          redis-version: ${{ matrix.redis }}
          auto-start: false

      - name: Test
        run: |
          perl Makefile.PL && make && make test

  test-dist:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        ssl: [0, 1]
    env:
      EV_REDIS_SSL: ${{ matrix.ssl }}
      EV_REDIS_REQUIRE_TLS_TESTS: ${{ matrix.ssl }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: "5"
          install-modules-with: cpm
          install-modules-args: --with-configure --with-test

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev openssl patch pkg-config

      - name: Set up Redis
        uses: shogo82148/actions-setup-redis@v1
        with:
          redis-version: "8"
          auto-start: false

      - name: Build, test and install the distribution
        run: perl .github/dist-test.pl

  build-perl-5-12:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Perl 5.12
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: "5.12"

      - name: Build and load (the test dependencies need perl 5.14)
        run: |
          cpanm --notest EV File::Which
          perl Makefile.PL && make
          perl -Mblib -MEV::Redis -e 'EV::Redis->new; print "EV::Redis $EV::Redis::VERSION loads\n"'

  test-i386-time64:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Test on a 32-bit perl with 64-bit time_t
        run: docker run --rm --platform linux/386 -v "$PWD":/src:ro i386/debian:stable-slim bash /src/.github/i386-time64.sh

  test-valgrind:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: "5.40"
          install-modules-with: cpm
          install-modules-args: --with-configure --with-test

      - name: Set up Redis
        uses: shogo82148/actions-setup-redis@v1
        with:
          redis-version: "7.4"
          auto-start: false

      - name: Install valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind

      - name: Test under valgrind
        run: |
          perl Makefile.PL && make
          perl=$(perl -MConfig -e 'print $Config{perlpath}')
          mkdir -p "$RUNNER_TEMP/valgrind"
          rc=0
          for t in t/*.t; do
            [ "$t" = t/timeout_traffic.t ] && continue
            echo "== $t"
            valgrind --error-exitcode=9 --quiet \
              --log-file="$RUNNER_TEMP/valgrind/memory-${t##*/}.%p.log" \
              "$perl" -Mblib "$t" || rc=1
          done
          exit $rc

      - name: Check lifecycle and push cleanup for definite leaks
        if: ${{ !cancelled() }}
        env:
          EV_REDIS_SOAK_ITERATIONS: "14"
        run: |
          perl=$(perl -MConfig -e 'print $Config{perlpath}')
          mkdir -p "$RUNNER_TEMP/valgrind"
          rc=0
          for t in t/resp3.t t/dispatch_state.t t/uaf_deferred_disconnect.t t/uaf_skip_pending.t .github/lifecycle.t; do
            echo "== $t"
            valgrind --error-exitcode=9 --leak-check=full \
              --show-leak-kinds=definite --errors-for-leak-kinds=definite \
              --log-file="$RUNNER_TEMP/valgrind/leaks-${t##*/}.%p.log" \
              "$perl" -Mblib "$t" || rc=1
          done
          exit $rc

      - name: Upload valgrind reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: valgrind
          path: ${{ runner.temp }}/valgrind/
          retention-days: 14

  test-valkey:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: "5.40"
          install-modules-with: cpm
          install-modules-args: --with-configure --with-test

      - name: Install Valkey
        run: |
          sudo apt-get update
          sudo apt-get install -y valkey-server openssl
          valkey-server --version
          # Test::RedisServer looks for redis-server; symlink valkey-server
          sudo ln -sf "$(which valkey-server)" /usr/local/bin/redis-server

      - name: Test
        run: |
          perl Makefile.PL && make && make test

  test-alpine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: alpine:latest

    steps:
      - name: Install dependencies
        run: |
          apk add --no-cache perl perl-dev perl-app-cpanminus make patch gcc musl-dev pkgconf openssl-dev openssl redis git

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Perl modules
        run: |
          cpanm -n EV EV::MakeMaker File::Which Test::Deep Test::TCP Test::RedisServer Devel::Refcount

      - name: Test
        run: |
          redis-server --daemonize yes
          perl Makefile.PL && make && make test

  test-freebsd:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Test on FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg install -y perl5 gmake pkgconf openssl redis
            pkg install -y p5-App-cpanminus p5-EV p5-File-Which p5-Test-Deep p5-Test-TCP
            cpanm -n Test::RedisServer Devel::Refcount
          run: |
            export PATH="/usr/local/sbin:/usr/local/bin:$PATH"
            which redis-server || echo "redis-server not found in PATH=$PATH"
            perl Makefile.PL && make && make test

  test-openbsd:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Test on OpenBSD
        uses: vmactions/openbsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg_add gmake pkgconf redis curl
            pkg_add p5-EV
            curl -L https://cpanmin.us | perl - App::cpanminus
            cpanm -n File::Which Test::Deep Test::TCP Test::RedisServer Devel::Refcount
          run: |
            export PATH="/usr/local/sbin:/usr/local/bin:$PATH"
            which redis-server || echo "redis-server not found in PATH=$PATH"
            perl Makefile.PL && make && make test
